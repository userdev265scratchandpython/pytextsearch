name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            archive: pytextsearch-linux.tar.gz

          - os: windows-latest
            name: windows
            archive: pytextsearch-windows.zip

          - os: macos-latest
            name: macos
            archive: pytextsearch-macos.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install rich cryptography nuitka

      - name: Build with Nuitka
        run: |
          python -m nuitka --standalone --follow-imports --assume-yes-for-downloads --output-dir=build textscan.py

      # Put EVERYTHING from the repository into the package.
      # The .git directory and GitHub workflow files are excluded.
      - name: Create package directory
        shell: bash
        run: |
          mkdir -p package

          cp -a . package/

          rm -rf package/.git
          rm -rf package/.github

          mkdir -p package/bin

          cp -a build/textscan.dist/. package/bin/

      - name: Package Linux
        if: matrix.name == 'linux'
        shell: bash
        run: |
          tar -czf "${{ matrix.archive }}" package/

      - name: Package macOS
        if: matrix.name == 'macos'
        shell: bash
        run: |
          tar -czf "${{ matrix.archive }}" package/

      - name: Package Windows
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.archive }}"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: pytextsearch-${{ matrix.name }}
          path: |
            pytextsearch-linux.tar.gz
            pytextsearch-windows.zip
            pytextsearch-macos.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: pytextsearch build ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: release/*
